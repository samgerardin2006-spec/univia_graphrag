[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "univia-graphrag"
version = "0.1.0"
description = "Evidence-backed local student program recommendations with Mistral"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
univia = "univia.__main__:main"

[tool.setuptools.packages.find]
include = ["univia*"]

[tool.setuptools.package-data]
univia = ["*.html"]
